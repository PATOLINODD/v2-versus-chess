<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versus Chess</title>

    <script type="module" src="./index.js"></script>

    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div style="position: relative; width: 640px; height: 640px;" id="game-container">
        <!-- Your existing canvas goes here -->
        <canvas id="chessboard" style="position: absolute; top: 0; left: 0; z-index: 1;"></canvas>

        <!-- The pieces container goes on top -->
        <div id="pieces-layer"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;">
        </div>

        <!-- Z-index 2: The Move Hints Layer -->
        <div id="hints-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;"></div>
        <!-- Z-index 3: The SVG Arrow Layer -->
        <svg id="arrow-layer"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none;">
            <!-- Define the arrowhead shape once in memory -->
            <defs>
                <!-- markerUnits="userSpaceOnUse" locks the size to exact pixels -->
                <marker id="arrowhead" markerWidth="64" markerHeight="64" orient="auto"
                    markerUnits="userSpaceOnUse">
                    <!-- A precisely defined 40x40 pixel triangle -->
                    <polygon id="head" points="0 0, 40 20, 0 40" fill="" />
                </marker>
            </defs>
        </svg>

    </div>
    <!-- Z-index 5: The FX Animation Canvas -->
    <canvas id="fx-layer" style="position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none;"></canvas>
</body>

</html>
