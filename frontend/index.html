<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versus Chess</title>

    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./styles/shared/flex.css">
    <link rel="stylesheet" href="./styles/components/button.css">

    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            padding: 0 3rem;
        }

        main {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            height: 50dvh;
        }

        form {
            padding: 1rem;
            min-width: 100%;
            height: 100%;
            will-change: transform;
            border-radius: var(--card-radius);

            background-color: var(--bg);
            color: var(--text);
        }

        form > * {
            width: 100%;
        }

        form input {
            background-color: var(--bg-light);
        }
    </style>


    <!-- LOAD COMPONENTS -->

    <script type="module" src="./components/initComponents.js"></script>
</head>
<body class="col gap-8">
    <div class="flex justify-between align-center gap-4">
        <button id="changeToLogin">Entrar</button><button id="changeTosignup">Criar Conta</button>
    </div>
    <main>
        <form id="loginForm" class="flex justify-center align-center col gap-4">
            <div class="flex col">
                <pato-floating-input label="Seu Email"></pato-floating-input>
            </div>
            <div class="flex col">
                <pato-floating-input label="Sua Senha" type="password"></pato-floating-input>
            </div>
            <div class="flex col-reverse gap-1">
                <a>Entrar Como Convidado</a>
                <button type="submit">ENTRAR</button>
            </div>
        </form>
        <form id="signupForm" class="flex justify-center align-center col gap-4">
            <pato-floating-input label="Seu Email"></pato-floating-input>
            <pato-floating-input label="Seu Apelido"></pato-floating-input>
            <pato-floating-input label="Sua Senha" type="password"></pato-floating-input>
            <div class="flex col-reverse gap-1">
                <a>Entrar Como Convidado</a>
                <button type="submit">CADASTRAR</button>
            </div>
        </form>
    </main>

    <script>
        let whichForm = "login";
        const login = document.querySelector('#changeToLogin');
        const signup = document.querySelector('#changeTosignup');
        const forms = document.querySelectorAll('form')

        login.addEventListener('click', () => {
            forms.forEach(form => {
                form.animate(
                    {
                       transform: ["translateX(0)"]
                    },
                    {
                        duration: 333, fill: 'forwards', easing: 'ease-out'
                    }
                )
            })
        })
        signup.addEventListener('click', () => {
            forms.forEach(form => {
                form.animate(
                    {
                       transform: ["translateX(-100%)"]
                    },
                    {
                        duration: 333, fill: 'forwards', easing: 'ease-out'
                    }
                )
            })
        })
    </script>
</body>
</html>
